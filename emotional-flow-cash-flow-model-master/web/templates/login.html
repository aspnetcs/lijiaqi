<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>登录 - 情绪-资金流分析系统</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <form method="post" action="/login" class="card">
    <h2>登录</h2>
    <div class="msg" id="msg">
      {% if request.query_params.get('registered') == '1' %}注册成功, 请登录{% endif %}
    </div>
    <div class="field">
      <label>用户名</label>
      <input type="text" name="username" required autocomplete="username">
    </div>
    <div class="field">
      <label>密码</label>
      <input type="password" name="password" required autocomplete="current-password">
    </div>
    <div class="field">
      <label>验证码</label>
      <div class="captcha-row">
        <input type="text" name="captcha" placeholder="请输入验证码" maxlength="4" required>
        <img src="/captcha" class="captcha-img" id="cap" title="点击刷新" onclick="this.src='/captcha?t='+Date.now()">
      </div>
    </div>
    <button class="btn" type="submit">登 录</button>
    <div class="link">没有账号? <a href="/register">立即注册</a></div>
  </form>
</body>
</html>
